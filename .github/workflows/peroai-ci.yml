# peroai fork: upstream ci.yml only runs on pull_request, so the fork's
# branch pushes get their own backend + frontend checks here.
name: peroai CI

on:
  push:
    branches: [peroai]
  pull_request:
    branches: [peroai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peroai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and billing tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Build root module
        run: go build ./...

      - name: Vet changed packages
        run: go vet ./relay/... ./service/... ./pkg/billingexpr/... ./setting/billing_setting/...

      # Verbose run of the kiro credit-billing tests so their names show in the log.
      - name: Billing tests (verbose)
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v \
            -run 'Kiro|ProviderUsage|TieredSettle|SmokeTestExpr|ModelPriceHelperTiered' \
            ./relay/channel/claude/... ./service/... ./pkg/billingexpr/... \
            ./relay/helper/... ./setting/billing_setting/... \
            | grep -E '^\s*(--- (PASS|FAIL)|PASS|FAIL|ok|panic)|_test\.go:[0-9]+|Error( Trace)?:|Messages:|expected|actual'

      - name: Full tests of touched packages
        run: >
          go test -count=1
          ./relay/channel/claude/...
          ./service/...
          ./pkg/billingexpr/...
          ./relay/helper/...
          ./relay/common/...
          ./setting/billing_setting/...
          ./controller/...

  frontend:
    name: Frontend typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Test
        run: bun run test
