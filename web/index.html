<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>peroai</title>
    <meta name="title" content="peroai" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#121417" />
    <!-- Tab icon comes from the Logo setting (main.tsx); these are the
         home-screen icon and web app manifest from the logo kit. -->
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/icons/manifest.json" />
    <!-- peroai fork: apply the theme class and page language before first
         paint, by the rules shared with the beta landing page and docs
         (design/v7/theme-i18n-spec.md §1): saved "light"/"dark" wins,
         "system" follows the OS, nothing saved means dark. The language is
         Chinese for any saved zh* value, else English; with nothing saved the
         browser language decides. ThemeProvider and i18next take over later
         with the same answer, so the page never flashes the other theme. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var mode = null
        var lang = null
        try {
          mode = localStorage.getItem('newapi:theme:v1:mode')
          lang = localStorage.getItem('i18nextLng')
          // The accent trial (11-22) left a choice in localStorage; it no
          // longer means anything.
          localStorage.removeItem('peroai:accent')
        } catch (e) {}
        if (mode === 'system') {
          mode =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        if (mode !== 'light') mode = 'dark'
        root.classList.remove('light', 'dark')
        root.classList.add(mode)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta)
          meta.setAttribute('content', mode === 'light' ? '#f5f6f7' : '#121417')
        if (!lang) lang = navigator.language || ''
        root.lang = /^zh/i.test(lang) ? 'zh-CN' : 'en'
      })()
    </script>
    <style>
      /* Body stays transparent so the console backdrop (body::before in
         theme-presets.css, a neutral sheen from the top) shows. */
      html {
        background: #121417;
      }
      html.light {
        background: #f5f6f7;
      }
      body {
        background: transparent;
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
