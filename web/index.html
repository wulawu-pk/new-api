<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>peroai</title>
    <meta name="title" content="peroai" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#121417" />
    <!-- peroai fork: the v3 console is dark-only (see ThemeProvider
         forcedTheme). Apply the class before first paint so the page never
         flashes light and one-shot detectors (e.g. Dark Reader) see it. -->
    <script>
      document.documentElement.classList.remove('light')
      document.documentElement.classList.add('dark')
      // Accent trial (11-22): ?accent=mint|blue|amber|violet|pink picks one
      // and remembers it (shared with the beta landing page, same origin).
      // Remove once the accent is chosen.
      try {
        var accents = ['pink', 'mint', 'blue', 'amber', 'violet']
        var asked = /[?&]accent=([a-z]+)/.exec(location.search)
        if (asked && accents.indexOf(asked[1]) >= 0) {
          localStorage.setItem('peroai:accent', asked[1])
        }
        var accent = localStorage.getItem('peroai:accent')
        if (accent && accent !== 'pink' && accents.indexOf(accent) >= 0) {
          document.documentElement.setAttribute('data-accent', accent)
        }
      } catch (e) {}
    </script>
    <style>
      /* Body stays transparent so the console backdrop (body::before in
         theme-presets.css, a neutral sheen from the top) shows. */
      html {
        background: #121417;
      }
      body {
        background: transparent;
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
